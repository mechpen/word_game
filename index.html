<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Memorization Quiz</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px;
      text-align: center;
    }

    .header h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .score-display {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .progress-bar {
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
    }

    .progress-fill {
      height: 100%;
      background: #4ade80;
      transition: width 0.3s ease;
    }

    .content {
      padding: 32px;
    }

    .word-display {
      text-align: center;
      margin-bottom: 28px;
    }

    .word-label {
      font-size: 0.9rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .word {
      font-size: 2.2rem;
      font-weight: 700;
      color: #1a1a2e;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      padding: 16px 20px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1rem;
      text-align: left;
      background: #fff;
      line-height: 1.5;
    }

    .option:hover:not(.disabled), .option.highlighted:not(.disabled) {
      border-color: #667eea;
      background: #f8f7ff;
      transform: translateX(4px);
    }

    .option.correct {
      border-color: #22c55e;
      background: #dcfce7;
    }

    .option.incorrect {
      border-color: #ef4444;
      background: #fee2e2;
    }

    .option.disabled {
      cursor: default;
    }

    .option-number {
      display: inline-block;
      width: 28px;
      height: 28px;
      line-height: 28px;
      text-align: center;
      background: #667eea;
      color: white;
      border-radius: 50%;
      margin-right: 12px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .feedback {
      margin-top: 24px;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .feedback.correct {
      background: #dcfce7;
      color: #166534;
    }

    .feedback.incorrect {
      background: #fee2e2;
      color: #991b1b;
    }

    .next-btn {
      display: none;
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .next-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .next-btn.show {
      display: block;
    }

    .start-screen, .end-screen {
      text-align: center;
      padding: 40px 32px;
    }

    .start-screen h2, .end-screen h2 {
      font-size: 1.6rem;
      margin-bottom: 16px;
      color: #1a1a2e;
    }

    .start-screen p, .end-screen p {
      color: #666;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .end-screen .final-score {
      font-size: 3rem;
      font-weight: 700;
      color: #667eea;
      margin: 20px 0;
    }

    .start-btn, .restart-btn {
      padding: 16px 40px;
      font-size: 1.1rem;
      font-weight: 600;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .start-btn:hover, .restart-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .quiz-screen {
      display: none;
    }

    .word-count {
      font-size: 0.9rem;
      color: #888;
      margin-top: 8px;
    }

    .stats-display {
      margin: 16px 0;
      font-size: 0.85rem;
    }

    .stat-option {
      display: inline-block;
      padding: 6px 12px;
      margin: 4px;
      border-radius: 20px;
      cursor: pointer;
      background: #e2e8f0;
      color: #475569;
      transition: all 0.2s;
      font-size: 0.85rem;
    }

    .stat-option:hover {
      background: #cbd5e1;
    }

    .stat-option.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-weight: 600;
    }

    .reset-btn {
      display: block;
      margin: 16px auto 0;
      padding: 10px 24px;
      font-size: 0.9rem;
      background: transparent;
      color: #666;
      border: 1px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      background: #f5f5f5;
      border-color: #999;
    }

    .quiz-options {
      margin: 16px 0;
    }

    .quiz-options label {
      color: #666;
      margin-right: 8px;
    }

    .quiz-options input {
      padding: 8px 12px;
      font-size: 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
      width: 70px;
      text-align: center;
    }

    .quiz-options input:focus {
      outline: none;
      border-color: #667eea;
    }

    .hint-btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      font-size: 0.95rem;
      background: #f0f9ff;
      color: #0369a1;
      border: 2px solid #bae6fd;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .hint-btn:hover {
      background: #e0f2fe;
      border-color: #7dd3fc;
    }

    .hint-btn.hidden {
      display: none;
    }

    .hint-btn.disabled {
      background: #f1f5f9;
      color: #94a3b8;
      border-color: #e2e8f0;
      cursor: not-allowed;
    }

    .hint-display {
      display: none;
      margin-top: 16px;
      padding: 16px;
      background: #fefce8;
      border: 2px solid #fde047;
      border-radius: 10px;
      font-style: italic;
      color: #713f12;
      line-height: 1.5;
    }

    .hint-display.show {
      display: block;
    }

    .word-details {
      margin-top: 8px;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.6;
      padding: 16px;
      border-radius: 10px;
      border: 2px solid;
    }

    .word-details.correct {
      background: #dcfce7;
      border-color: #22c55e;
    }

    .word-details.incorrect {
      background: #fee2e2;
      border-color: #ef4444;
    }

    .word-details .detail-row {
      margin-bottom: 8px;
    }

    .word-details .detail-row:last-child {
      margin-bottom: 0;
    }

    .word-details .detail-label {
      font-weight: 600;
    }

    .word-details.correct .detail-label {
      color: #166534;
    }

    .word-details.incorrect .detail-label {
      color: #991b1b;
    }

    .word-details .detail-example {
      font-style: italic;
    }

    .hint-display .hint-label {
      font-weight: 600;
      font-style: normal;
      margin-bottom: 6px;
      color: #a16207;
    }

    .highlight-word {
      background: linear-gradient(120deg, #fde68a 0%, #fcd34d 100%);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-style: normal;
      color: #92400e;
    }

    @media (max-width: 480px) {
      .word {
        font-size: 1.8rem;
      }
      .option {
        padding: 14px 16px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Word Quiz</h1>
      <div class="score-display">Score: <span id="score">0</span> / <span id="total">0</span></div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
      </div>
    </div>

    <div class="start-screen" id="start-screen">
      <h2>Ready to test your vocabulary?</h2>
      <p>You'll be shown a word and four possible definitions. Pick the correct one!</p>
      <p>Words you miss will appear more often. Words you know will fade away.</p>
      <p class="word-count" id="word-count"></p>
      <div class="stats-display" id="stats-display"></div>
      <div class="quiz-options">
        <label for="num-questions">Questions per quiz:</label>
        <input type="number" id="num-questions" value="10" min="1" max="100">
      </div>
      <button class="start-btn" onclick="startQuiz()">Start Quiz</button>
      <button class="reset-btn" onclick="resetProgress()">Reset Progress</button>
    </div>

    <div class="quiz-screen" id="quiz-screen">
      <div class="content">
        <div class="word-display">
          <div class="word-label" id="word-label">What does this word mean?</div>
          <div class="word" id="current-word"></div>
        </div>

        <div class="options" id="options"></div>

        <button class="hint-btn" id="hint-btn" onclick="showHint()">Show Hint</button>
        <div class="hint-display" id="hint-display"></div>

        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Word</button>
      </div>
    </div>

    <div class="end-screen" id="end-screen" style="display: none;">
      <h2>Quiz Complete!</h2>
      <div class="final-score" id="final-score"></div>
      <p id="end-message"></p>
      <button class="restart-btn" onclick="startQuiz()">Play Again</button>
    </div>
  </div>

  <script>
    const WORDS = {

    let wordList = Object.keys(WORDS);
    let allDefinitions = Object.values(WORDS).map(w => w.def);
    let allSynonyms = Object.values(WORDS).map(w => w.syn);
    let allAntonyms = Object.values(WORDS).map(w => w.ant);
    let currentQuestionType = 'def'; // 'def', 'syn', or 'ant'
    let score = 0;
    let total = 0;
    let currentWord = '';
    let correctIndex = -1;
    let answered = false;
    let questionsPerRound = 10;
    let hintUsedThisQuestion = false;
    let highlightedOption = -1;
    let focusMode = null; // null = all words, 'struggling' = only needs work
    let questionModes = ['def', 'syn', 'ant']; // selected question types

    // Spaced repetition: track weight for each word
    // Higher weight = shown more often
    const STORAGE_KEY = 'wordQuizWeights';
    let wordWeights = loadWeights();

    function loadWeights() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        return JSON.parse(saved);
      }
      // Initialize all words with weight 1
      const weights = {};
      wordList.forEach(word => weights[word] = 1);
      return weights;
    }

    function saveWeights() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(wordWeights));
    }

    function pickWeightedWord() {
      // Get word pool based on focus mode
      let pool = getWordsByMode(focusMode);
      if (pool.length === 0) pool = wordList; // fallback

      // Calculate total weight
      let totalWeight = 0;
      pool.forEach(word => {
        totalWeight += wordWeights[word] || 1;
      });

      // Pick random point in weight range
      let random = Math.random() * totalWeight;
      let cumulative = 0;

      for (const word of pool) {
        cumulative += wordWeights[word] || 1;
        if (random <= cumulative) {
          return word;
        }
      }
      return pool[pool.length - 1];
    }

    function updateWeight(word, correct) {
      if (correct) {
        if (hintUsedThisQuestion) {
          // Used hint: smaller decrease (word still needs practice)
          wordWeights[word] = Math.max(0.3, (wordWeights[word] || 1) * 0.85);
        } else {
          // No hint: full decrease
          wordWeights[word] = Math.max(0.1, (wordWeights[word] || 1) * 0.6);
        }
      } else {
        // Increase weight significantly
        wordWeights[word] = Math.min(10, (wordWeights[word] || 1) * 2);
      }
      saveWeights();
    }

    function resetProgress() {
      wordList.forEach(word => wordWeights[word] = 1);
      saveWeights();
      updateStatsDisplay();
    }

    function getStats() {
      let mastered = 0, learning = 0, struggling = 0;
      wordList.forEach(word => {
        const w = wordWeights[word] || 1;
        if (w <= 0.4) mastered++;
        else if (w >= 2) struggling++;
        else learning++;
      });
      return { mastered, learning, struggling };
    }

    function getWordsByMode(mode) {
      if (mode === 'learned') {
        return wordList.filter(word => (wordWeights[word] || 1) <= 0.4);
      } else if (mode === 'unlearned') {
        return wordList.filter(word => (wordWeights[word] || 1) > 0.4);
      } else if (mode === 'struggling') {
        return wordList.filter(word => (wordWeights[word] || 1) >= 2);
      }
      return wordList;
    }

    function updateStatsDisplay() {
      const stats = getStats();
      const statsEl = document.getElementById('stats-display');
      if (statsEl) {
        statsEl.innerHTML = `
          <div style="margin-bottom: 8px;">
            <span class="stat-option ${focusMode === null ? 'active' : ''}" onclick="setFocusMode(null)">All (${wordList.length})</span>
            <span class="stat-option ${focusMode === 'learned' ? 'active' : ''}" onclick="setFocusMode('learned')">Learned (${stats.mastered})</span>
            <span class="stat-option ${focusMode === 'unlearned' ? 'active' : ''}" onclick="setFocusMode('unlearned')">Unlearned (${wordList.length - stats.mastered})</span>
            <span class="stat-option ${focusMode === 'struggling' ? 'active' : ''}" onclick="setFocusMode('struggling')">Needs work (${stats.struggling})</span>
          </div>
          <div>
            <span class="stat-option ${questionModes.includes('def') ? 'active' : ''}" onclick="toggleQuestionMode('def')">Definition</span>
            <span class="stat-option ${questionModes.includes('syn') ? 'active' : ''}" onclick="toggleQuestionMode('syn')">Synonym</span>
            <span class="stat-option ${questionModes.includes('ant') ? 'active' : ''}" onclick="toggleQuestionMode('ant')">Antonym</span>
          </div>
        `;
      }
    }

    function setFocusMode(mode) {
      const words = getWordsByMode(mode);
      if (words.length === 0) {
        alert('No words in this category!');
        return;
      }
      focusMode = mode;
      updateStatsDisplay();
    }

    function toggleQuestionMode(mode) {
      if (questionModes.includes(mode)) {
        if (questionModes.length > 1) {
          questionModes = questionModes.filter(m => m !== mode);
        }
      } else {
        questionModes.push(mode);
      }
      updateStatsDisplay();
    }

    function showHint() {
      hintUsedThisQuestion = true;

      const example = WORDS[currentWord].ex;
      const hintDisplay = document.getElementById('hint-display');
      // Highlight the word in the example
      const wordClean = currentWord.replace(/\s*\(.*\)/, ''); // remove annotations like "(adjective)"
      const regex = new RegExp(`(${wordClean})`, 'gi');
      const highlightedExample = example.replace(regex, '<span class="highlight-word">$1</span>');
      hintDisplay.innerHTML = `<div class="hint-label">Example:</div>"${highlightedExample}"`;
      hintDisplay.classList.add('show');
      document.getElementById('hint-btn').classList.add('hidden');
    }

    function hideHint() {
      document.getElementById('hint-display').classList.remove('show');
      document.getElementById('hint-btn').classList.remove('hidden');
      hintUsedThisQuestion = false;
      updateHintButton();
    }

    function updateHintButton() {
      const btn = document.getElementById('hint-btn');
      btn.textContent = 'Show Hint';
      btn.disabled = false;
      btn.classList.remove('disabled');
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      questionsPerRound = parseInt(document.getElementById('num-questions').value);
      score = 0;
      total = 0;
      updateScore();
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('end-screen').style.display = 'none';
      document.getElementById('quiz-screen').style.display = 'block';
      nextQuestion();
    }

    function updateScore() {
      document.getElementById('score').textContent = score;
      document.getElementById('total').textContent = total;
      const pct = total > 0 ? (score / total) * 100 : 0;
      document.getElementById('progress').style.width = pct + '%';
    }

    function nextQuestion() {
      if (total >= questionsPerRound) {
        endQuiz();
        return;
      }

      answered = false;
      highlightedOption = -1;
      document.getElementById('feedback').classList.remove('show', 'correct', 'incorrect');
      document.getElementById('next-btn').classList.remove('show');
      hideHint();

      // Pick word using weighted selection (spaced repetition)
      currentWord = pickWeightedWord();

      // Pick question type from selected modes
      currentQuestionType = questionModes[Math.floor(Math.random() * questionModes.length)];

      let correctAnswer, wrongAnswers, questionLabel;

      if (currentQuestionType === 'def') {
        correctAnswer = WORDS[currentWord].def;
        wrongAnswers = allDefinitions.filter(d => d !== correctAnswer);
        questionLabel = 'What does this word mean?';
      } else if (currentQuestionType === 'syn') {
        correctAnswer = WORDS[currentWord].syn;
        wrongAnswers = allSynonyms.filter(s => s !== correctAnswer);
        questionLabel = '🔵 SYNONYM';
      } else {
        correctAnswer = WORDS[currentWord].ant;
        wrongAnswers = allAntonyms.filter(a => a !== correctAnswer);
        questionLabel = '🔴 ANTONYM';
      }

      const shuffledWrong = shuffle(wrongAnswers).slice(0, 3);
      let options = [correctAnswer, ...shuffledWrong];
      options = shuffle(options);
      correctIndex = options.indexOf(correctAnswer);

      // Display
      document.getElementById('word-label').textContent = questionLabel;
      document.getElementById('current-word').textContent = currentWord.toLowerCase();

      const optionsContainer = document.getElementById('options');
      optionsContainer.innerHTML = '';

      options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.textContent = opt;
        btn.onclick = () => selectAnswer(i);
        optionsContainer.appendChild(btn);
      });
    }

    function selectAnswer(index) {
      if (answered) return;
      answered = true;
      total++;

      const options = document.querySelectorAll('.option');
      options.forEach(opt => opt.classList.add('disabled'));

      const feedback = document.getElementById('feedback');

      const wordInfo = WORDS[currentWord];
      const isCorrect = index === correctIndex;
      const wordClean = currentWord.replace(/\s*\(.*\)/, '');
      const regex = new RegExp(`(${wordClean})`, 'gi');
      const highlightedEx = wordInfo.ex.replace(regex, '<span class="highlight-word">$1</span>');
      const wordDetails = `<div class="word-details ${isCorrect ? 'correct' : 'incorrect'}">
        <div class="detail-row"><span class="detail-label">Meaning:</span> ${wordInfo.def}</div>
        <div class="detail-row"><span class="detail-label">Example:</span> <span class="detail-example">"${highlightedEx}"</span></div>
      </div>`;

      if (isCorrect) {
        score++;
        options[index].classList.add('correct');
        updateWeight(currentWord, true);
      } else {
        options[index].classList.add('incorrect');
        options[correctIndex].classList.add('correct');
        updateWeight(currentWord, false);
      }
      feedback.innerHTML = wordDetails;
      updateStatsDisplay();

      feedback.classList.add('show');
      updateScore();
      document.getElementById('next-btn').classList.add('show');
    }

    function endQuiz() {
      document.getElementById('quiz-screen').style.display = 'none';
      document.getElementById('end-screen').style.display = 'block';

      const pct = Math.round((score / total) * 100);
      document.getElementById('final-score').textContent = `${score}/${total} (${pct}%)`;

      let msg = '';
      if (pct === 100) msg = 'Perfect score! Amazing!';
      else if (pct >= 80) msg = 'Great job! Keep practicing!';
      else if (pct >= 60) msg = 'Good effort! A bit more practice will help.';
      else msg = 'Keep studying and try again!';

      document.getElementById('end-message').textContent = msg;
    }

    // Initialize word count and stats display
    document.getElementById('word-count').textContent = `${wordList.length} words loaded`;
    updateStatsDisplay();

    function updateHighlight() {
      const options = document.querySelectorAll('.option');
      options.forEach((opt, i) => {
        if (i === highlightedOption) {
          opt.classList.add('highlighted');
        } else {
          opt.classList.remove('highlighted');
        }
      });
    }

    document.addEventListener('keydown', function(e) {
      const quizScreen = document.getElementById('quiz-screen');
      if (quizScreen.style.display !== 'block') return;

      const options = document.querySelectorAll('.option');

      if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 's' || e.key === 'S') {
        e.preventDefault();
        if (!answered) {
          highlightedOption = (highlightedOption + 1) % 4;
          updateHighlight();
        }
      } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'w' || e.key === 'W') {
        e.preventDefault();
        if (!answered) {
          highlightedOption = (highlightedOption - 1 + 4) % 4;
          updateHighlight();
        }
      } else if (e.key === 'Enter' || e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        if (answered) {
          nextQuestion();
        } else if (highlightedOption >= 0) {
          selectAnswer(highlightedOption);
        }
      } else if (e.key >= '1' && e.key <= '4' && !answered) {
        e.preventDefault();
        const index = parseInt(e.key) - 1;
        highlightedOption = index;
        updateHighlight();
        selectAnswer(index);
      }
    });
  </script>
</body>
</html>
